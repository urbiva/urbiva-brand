<line x1="230" y1="500" x2="546.6" y2="404.1" stroke="#A39AC4" stroke-width="3" stroke-dasharray="8 8"/><polygon points="560,400 548.9,411.7 544.3,396.4" fill="#A39AC4"/>
<rect x="80" y="760" width="40" height="0" stroke="#D5FF66" stroke-width="3"/><line x1="80" y1="760" x2="120" y2="760" stroke="#D5FF66" stroke-width="3"/>
<text x="136" y="766" font-family="Inter" font-size="18" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Implemented in urbiva-app (MVP, sample pilot network)</text>
<line x1="80" y1="800" x2="120" y2="800" stroke="#A39AC4" stroke-width="3" stroke-dasharray="8 8"/>
<text x="136" y="806" font-family="Inter" font-size="18" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Planned research in urbiva-ai (no model, weights or results exist yet)</text>
<text x="80" y="880" font-family="IBM Plex Mono" font-size="16" font-weight="500" fill="#D5FF66" text-anchor="start" letter-spacing="1" opacity="1">Every city. Every possibility.</text>
