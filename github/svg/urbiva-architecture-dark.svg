<text x="80" y="96" font-family="Manrope" font-size="44" font-weight="800" fill="#F7F5F0" text-anchor="start" letter-spacing="-1" opacity="1">How Urbiva works</text>
<text x="80" y="138" font-family="Inter" font-size="20" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">From an observation on the street to a simulated infrastructure decision. Data in the current demo comes from a sample pilot network.</text>
<rect x="80" y="210" width="310" height="190" rx="18" fill="#2B2250" stroke="#D5FF66" stroke-width="2"/>
<g transform="translate(104,236) scale(1.1667)" fill="none" stroke="#D5FF66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></g>
<text x="146" y="260" font-family="Manrope" font-size="24" font-weight="700" fill="#F7F5F0" text-anchor="start" letter-spacing="0" opacity="1">Urban Observation</text>
<text x="104" y="300" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Resident photographs a</text>
<text x="104" y="328" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">barrier on a segment.</text>
<text x="104" y="356" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Photo is re-encoded,</text>
<text x="104" y="384" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">EXIF and GPS removed.</text>
<rect x="440" y="210" width="320" height="190" rx="18" fill="#2B2250" stroke="#D5FF66" stroke-width="2"/>
<g transform="translate(464,236) scale(1.1667)" fill="none" stroke="#D5FF66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></g>
<text x="506" y="260" font-family="Manrope" font-size="24" font-weight="700" fill="#F7F5F0" text-anchor="start" letter-spacing="0" opacity="1">Urbiva Vision</text>
<text x="464" y="300" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Vision model estimate</text>
<text x="464" y="328" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">(today: Claude vision API)</text>
<text x="464" y="356" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">plus human confirmation.</text>
<text x="464" y="384" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Manual fallback without AI.</text>
<rect x="810" y="210" width="340" height="190" rx="18" fill="#2B2250" stroke="#D5FF66" stroke-width="2"/>
<g transform="translate(834,236) scale(1.1667)" fill="none" stroke="#D5FF66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
<text x="876" y="260" font-family="Manrope" font-size="24" font-weight="700" fill="#F7F5F0" text-anchor="start" letter-spacing="0" opacity="1">Verified Barrier Data</text>
<text x="834" y="300" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Reports: unverified,</text>
<text x="834" y="328" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">AI estimate, confirmed.</text>
<text x="834" y="356" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Planner reviews in</text>
<text x="834" y="384" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Urbiva Urban.</text>
<rect x="1200" y="210" width="320" height="190" rx="18" fill="#2B2250" stroke="#D5FF66" stroke-width="2"/>
<g transform="translate(1224,236) scale(1.1667)" fill="none" stroke="#D5FF66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></g>
<text x="1266" y="260" font-family="Manrope" font-size="24" font-weight="700" fill="#F7F5F0" text-anchor="start" letter-spacing="0" opacity="1">Accessibility Graph</text>
<text x="1224" y="300" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Nodes, segments, barriers.</text>
<text x="1224" y="328" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Passability per profile:</text>
<text x="1224" y="356" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">ok, uncertain, unknown,</text>
<text x="1224" y="384" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">blocked.</text>
<rect x="1200" y="500" width="320" height="170" rx="18" fill="#2B2250" stroke="#D5FF66" stroke-width="2"/>
<g transform="translate(1224,526) scale(1.1667)" fill="none" stroke="#D5FF66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></g>
<text x="1266" y="550" font-family="Manrope" font-size="24" font-weight="700" fill="#F7F5F0" text-anchor="start" letter-spacing="0" opacity="1">Urbiva Go</text>
<text x="1224" y="590" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Dijkstra: suitable route</text>
<text x="1224" y="618" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">vs shortest route.</text>
<text x="1224" y="646" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Penalties for uncertainty.</text>
<rect x="840" y="500" width="300" height="170" rx="18" fill="#2B2250" stroke="#D5FF66" stroke-width="2"/>
<g transform="translate(864,526) scale(1.1667)" fill="none" stroke="#D5FF66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 8 12 13l9.5-5z"/><path d="M2.5 13 12 18l9.5-5"/></g>
<text x="906" y="550" font-family="Manrope" font-size="24" font-weight="700" fill="#F7F5F0" text-anchor="start" letter-spacing="0" opacity="1">Urbiva Urban</text>
<text x="864" y="590" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Metrics from the graph.</text>
<text x="864" y="618" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Review and prioritise</text>
<text x="864" y="646" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">confirmed barriers.</text>
<rect x="440" y="500" width="340" height="170" rx="18" fill="#2B2250" stroke="#D5FF66" stroke-width="2"/>
<g transform="translate(464,526) scale(1.1667)" fill="none" stroke="#D5FF66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l12 7-12 7z"/></g>
<text x="506" y="550" font-family="Manrope" font-size="24" font-weight="700" fill="#F7F5F0" text-anchor="start" letter-spacing="0" opacity="1">Urbiva Impact</text>
<text x="464" y="590" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">simulateIntervention on a</text>
<text x="464" y="618" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">graph copy: 15 min reach,</text>
<text x="464" y="646" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">before and after.</text>
<rect x="80" y="500" width="300" height="170" rx="18" fill="#2B2250" stroke="#A39AC4" stroke-width="2" stroke-dasharray="10 8"/>
<g transform="translate(104,526) scale(1.1667)" fill="none" stroke="#A39AC4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></g>
<text x="146" y="550" font-family="Manrope" font-size="24" font-weight="700" fill="#F7F5F0" text-anchor="start" letter-spacing="0" opacity="1">UVA-Net S10</text>
<text x="104" y="590" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Planned local vision model</text>
<text x="104" y="618" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">≤ 10M parameters.</text>
<text x="104" y="646" font-family="Inter" font-size="17" font-weight="400" fill="#B9B1CE" text-anchor="start" letter-spacing="0" opacity="1">Not trained yet.</text>
